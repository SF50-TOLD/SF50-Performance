# CI Matrix Policy
#
# Darwin: the package targets the iOS 27 and macOS 27 SDKs, which ship with Xcode 27 on the
#         `xcode-27` image. Its bundled toolchain is Swift 6.4, so selecting Xcode is the whole
#         toolchain setup.
# Linux:  the official `swift:6.4.1-noble` image, the toolchain the server consumers build with.
#
# `// swift-tools-version:` is 6.4 because `.macOS("27.0")` needs a 6.4 manifest.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-darwin:
    name: Build and Test (macOS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.1
      # `latest` rather than `latest-stable`: the macOS 27 SDK is what this
      # package needs, and it ships with an Xcode that may still be a preview.
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-test-xcode-27-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
  tests-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: swiftpm-test-swift-6.4.1-noble-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
  lint:
    name: Run SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run SwiftLint
        run: swiftlint --strict
  swift-format:
    name: Run swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run swift-format lint
        run: swift format lint --strict -r Sources Tests Package.swift
